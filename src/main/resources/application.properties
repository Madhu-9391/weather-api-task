spring.application.name=weather-pincode-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/weather_assignment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

openweather.api-key=${OPENWEATHER_API_KEY}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=${SERVER_PORT:8080}
